<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e">
        <animate attributeName="stop-color" values="#16161e;#1a1b26;#16161e" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1f2335">
        <animate attributeName="stop-color" values="#1f2335;#24283b;#1f2335" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#3b4261">
        <animate attributeName="stop-color" values="#3b4261;#414868;#3b4261" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#2ac3de" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0caf5" />
      <stop offset="50%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded top corners -->
  <rect width="1200" height="200" rx="12" fill="url(#bgGrad)" />

  <!-- Subtle tech grid accent -->
  <g stroke="#7aa2f7" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="400" y1="0" x2="400" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="800" y1="0" x2="800" y2="200" />
    <line x1="1000" y1="0" x2="1000" y2="200" />
  </g>

  <!-- Animated Wave 1 -->
  <path fill="url(#waveGrad1)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="
      M0,150 C300,210 600,100 900,160 C1050,190 1150,150 1200,140 L1200,0 L0,0 Z;
      M0,160 C300,110 600,210 900,140 C1050,120 1150,180 1200,160 L1200,0 L0,0 Z;
      M0,150 C300,210 600,100 900,160 C1050,190 1150,150 1200,140 L1200,0 L0,0 Z" />
  </path>

  <!-- Animated Wave 2 -->
  <path fill="url(#waveGrad2)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="
      M0,175 C250,130 550,220 850,165 C1020,135 1120,185 1200,175 L1200,0 L0,0 Z;
      M0,165 C250,215 550,135 850,190 C1020,210 1120,150 1200,165 L1200,0 L0,0 Z;
      M0,175 C250,130 550,220 850,165 C1020,135 1120,185 1200,175 L1200,0 L0,0 Z" />
  </path>

  <!-- Main Waving Bottom Edge -->
  <path fill="url(#bgGrad)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="
      M0,185 C320,235 580,145 900,195 C1060,220 1140,185 1200,175 L1200,0 L0,0 Z;
      M0,195 C320,145 580,230 900,175 C1060,150 1140,205 1200,195 L1200,0 L0,0 Z;
      M0,185 C320,235 580,145 900,195 C1060,220 1140,185 1200,175 L1200,0 L0,0 Z" />
  </path>

  <!-- Glowing accent dots -->
  <circle cx="150" cy="50" r="2.5" fill="#7aa2f7" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="65" r="3" fill="#bb9af7" opacity="0.7">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="950" cy="130" r="2" fill="#7dcfff" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="240" cy="125" r="2" fill="#2ac3de" opacity="0.6">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Title Text -->
  <text x="600" y="92" text-anchor="middle" font-family="'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="1">
    Breno Barroso
  </text>

  <!-- Subtitle Text -->
  <text x="600" y="135" text-anchor="middle" font-family="'Fira Code', 'JetBrains Mono', 'Segoe UI', monospace, sans-serif" font-size="20" font-weight="600" fill="#a9b1d6" letter-spacing="0.8">
    Back-End Software Engineer  •  C# &amp; .NET  •  Microservices &amp; PIX
  </text>
</svg>
